version: '3.8'

services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: always

  server:
    image: ${DOCKER_USERNAME:-yourusername}/shopsmart-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=mongodb://mongodb:27017/shopsmart
      - JWT_SECRET=supersafesecret_shopsmart_2026
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongodb
    restart: always

  client:
    image: ${DOCKER_USERNAME:-yourusername}/shopsmart-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: always

volumes:
  mongodb_data:
